    <title>Shuvam Chowdhury · Portfolio</title>
    <meta name="title" content="Shuvam Chowdhury · Portfolio" />

    <meta name="application-name" content="Shuvam Chowdhury · Portfolio" />
    <meta name="apple-mobile-web-app-title" content="Shuvam Chowdhury · Portfolio" />
    <meta name="theme-color" content="#0c0f17" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shuvam Chowdhury · Portfolio" />
    <meta property="og:description" content="Shuvam Chowdhury — BCA student at IEM Kolkata, aspiring Software Developer, and photographer. Personal portfolio showcasing real projects, core computer science, certifications, and photography." />
    <meta property="og:site_name" content="Shuvam Chowdhury · Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shuvam Chowdhury · Portfolio" />
    <meta name="twitter:description" content="Shuvam Chowdhury — BCA student at IEM Kolkata, aspiring Software Developer, and photographer. Personal portfolio showcasing real projects, core computer science, certifications, and photography." />
    
    <!-- Editorial & Technical Craft Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Preload Light and Dark Background Images for instant cross-fade -->
    <link rel="preload" as="image" href="/backgrounds/light-mode-bg.jpg" />
    <link rel="preload" as="image" href="/backgrounds/dark-mode-bg.jpg" />

    <!-- Prevent theme flash on reload -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('dark'); // Dark-first default
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-amber-500/20 selection:text-amber-600 dark:selection:text-amber-400 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
